<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterviewAI – Mock Interview Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/fontsource-inter@5.0.16/index.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fontsource-jetbrains-mono@5.0.18/index.min.css" rel="stylesheet">
    <!-- <link rel="stylesheet" href="css/tailwind-config.css"> -->
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- PDF.js for resume text extraction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    
    <!-- MediaPipe for real camera face tracking and eye gaze mesh -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        surface: { 50: '#fafafa', 100: '#f5f5f5', 200: '#e5e5e5', 300: '#d4d4d4', 400: '#a3a3a3', 500: '#737373', 600: '#525252', 700: '#404040', 800: '#262626', 900: '#171717', 950: '#0a0a0a' },
                        accent: { 50: '#eef9ff', 100: '#d9f2ff', 200: '#bce7ff', 300: '#8ed9ff', 400: '#59c3ff', 500: '#33a3ff', 600: '#1a80f0', 700: '#1467d9', 800: '#1755b1', 900: '#19498b' },
                        success: { 400: '#4ade80', 500: '#22c55e' },
                        warning: { 400: '#facc15', 500: '#eab308' },
                        danger: { 400: '#f87171', 500: '#ef4444' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface-950 text-surface-200 font-sans min-h-screen">

<div id="app"></div>

<!-- Core modules (order matters) -->
<script src="js/state.js?v=1.3"></script>
<script src="js/data.js?v=1.3"></script>
<script src="js/router.js?v=1.3"></script>

<!-- Page renderers -->
<script src="pages/landing.js?v=1.3"></script>
<script src="pages/upload.js?v=1.3"></script>
<script src="pages/analysis.js?v=1.3"></script>
<script src="pages/setup.js?v=1.3"></script>
<script src="pages/interview.js?v=1.3"></script>
<script src="pages/results.js?v=1.3"></script>

<!-- Init -->
<script>
    render();
</script>
</body>
</html>
