# InterviewAI — app + Postgres + Redis.
#
# Both backing services are genuinely required in production: settings.py
# refuses to boot without a reachable Redis, because the in-memory session
# fallback is single-worker only and would silently lose interviews.
#
#   cp .env.production.example .env.production   # then fill it in
#   docker compose up --build
#
# The app reads configuration from .env.production. That file is gitignored and
# must never be baked into the image.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: interviewai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your shell or .env}
      POSTGRES_DB: interviewai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewai -d interviewai"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host: only the app needs to reach it.
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Sessions carry a 6-hour TTL and are recomputable from Postgres once a
    # report exists, so eviction is preferable to an out-of-memory kill.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    expose:
      - "6379"

  app:
    build:
      context: .
      args:
        # Set to 0 for a ~460 MB smaller image, at the cost of a multi-minute
        # stall on the first transcription while the model downloads.
        BAKE_WHISPER: "1"
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # Compose-internal hostnames override whatever the env file says, so the
      # same file works for a non-Docker deploy.
      DATABASE_URL: postgresql://interviewai:${POSTGRES_PASSWORD}@db:5432/interviewai
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # torch + YOLO + faster-whisper resident together. Below ~1.5 GB the
    # container will be OOM-killed on the first transcription.
    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  pgdata:
